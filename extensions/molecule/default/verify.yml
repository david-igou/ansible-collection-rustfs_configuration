---
# Verify, in order:
#   1. the role repairs the drift side_effect.yml injected — asserting the
#      EXACT change set — and server-side state is independently confirmed
#      (podman exec into the server container: buckets are directories in
#      /data on 1.0.0-beta.8 — this coupling is the FIRST suspect if a
#      server image bump breaks verify);
#   2. a follow-up run is clean;
#   3. drift-detection mode reports pending changes, FAILS, mutates nothing;
#   4. a real converge applies exactly those changes;
#   5. the versioning suspend branch converges;
#   6. unmanaged reporting: a spec'd-out bucket AND an out-of-band extra
#      policy attachment (injected here — rc has no detach, so only the
#      allowlist can ever silence it) are REPORTED, never deleted/detached;
#      fail_on_unmanaged escalates both; ignore_unmanaged silences both;
#   7. dead credentials fail the play (liveness path);
#   8. error classification — bad admin credentials fast-fail at the
#      credential assert (auth errors never retry), an unreachable
#      endpoint is retried (network class) then surfaces as the probe
#      task's own failure, not as a credential failure.
- name: Verify
  hosts: stubs
  gather_facts: false
  vars:
    _probe_versioned:
      name: drift-probe
      versioning: true
    _probe_suspended:
      name: drift-probe
      versioning: false
  tasks:
    # ---- 1. repair injected drift, assert the exact change set ----
    - name: Re-converge over injected drift
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state

    - name: Assert all four drifts were caught and repaired (exact set)
      ansible.builtin.assert:
        that:
          - rustfs_state_changes | sort == [
              'rustfs-molecule:bucket:app-backups:lifecycle:import',
              'rustfs-molecule:bucket:app-backups:versioning:enable',
              'rustfs-molecule:policy:app-rw:update',
              'rustfs-molecule:user:app-user:attach:app-rw',
              'rustfs-molecule:user:app-user:create',
            ] | sort
          - rustfs_state_liveness_failures | length == 0
        fail_msg: "unexpected change set: {{ rustfs_state_changes }}"

    - name: Read server-side bucket directories
      ansible.builtin.command: podman exec rustfs-server ls /data
      register: _server_buckets
      changed_when: false

    - name: Assert managed buckets exist server-side (independent of role bookkeeping)
      ansible.builtin.assert:
        that:
          - "'app-data' in _server_buckets.stdout_lines"
          - "'app-backups' in _server_buckets.stdout_lines"
          - "'drift-probe' not in _server_buckets.stdout_lines"

    # ---- 2. clean follow-up run ----
    - name: Converge again (must be clean)
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state

    - name: Assert the follow-up run found nothing to do
      ansible.builtin.assert:
        that:
          - rustfs_state_changes | length == 0
          - rustfs_state_unmanaged | length == 0
          - rustfs_state_liveness_failures | length == 0
        fail_msg: >-
          not clean after repair: changes={{ rustfs_state_changes }}
          unmanaged={{ rustfs_state_unmanaged }}

    # ---- 3. drift-detection mode: reports, fails, mutates nothing ----
    # check_mode is not a valid keyword on include_role itself; a wrapping
    # block propagates it to the included tasks. The explicit fail_on_drift
    # stands in for ansible_check_mode, which only reflects a play-level
    # --check.
    - name: Drift-detection mode must fail on pending changes without applying them
      block:
        - name: Run role in check mode against a spec with an extra bucket
          check_mode: true
          vars:
            rustfs_state_buckets: "{{ rustfs_molecule_buckets_base + [_probe_versioned] }}"
            rustfs_state_fail_on_drift: true
          block:
            - name: Include role under check mode
              ansible.builtin.include_role:
                name: david_igou.rustfs_configuration.rustfs_state

        - name: Unreachable — drift detection must have failed above
          ansible.builtin.fail:
            msg: drift-detection mode passed despite pending changes
      rescue:
        - name: Assert the failure was the drift assert, with the exact pending set
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail on drift (drift-detection mode)'
              - rustfs_state_changes | sort == [
                  'rustfs-molecule:bucket:drift-probe:create',
                  'rustfs-molecule:bucket:drift-probe:versioning:enable',
                ] | sort
            fail_msg: "unexpected drift report: {{ rustfs_state_changes }}"

    - name: Re-read server-side bucket directories
      ansible.builtin.command: podman exec rustfs-server ls /data
      register: _server_buckets_after_check
      changed_when: false

    - name: Assert check mode created nothing server-side
      ansible.builtin.assert:
        that: "'drift-probe' not in _server_buckets_after_check.stdout_lines"

    # ---- 4. real converge applies exactly the pending changes ----
    - name: Converge the probe spec for real
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state
      vars:
        rustfs_state_buckets: "{{ rustfs_molecule_buckets_base + [_probe_versioned] }}"

    - name: Assert exactly the probe changes were applied
      ansible.builtin.assert:
        that:
          - rustfs_state_changes | sort == [
              'rustfs-molecule:bucket:drift-probe:create',
              'rustfs-molecule:bucket:drift-probe:versioning:enable',
            ] | sort
        fail_msg: "unexpected change set: {{ rustfs_state_changes }}"

    - name: Read server-side bucket directories after probe converge
      ansible.builtin.command: podman exec rustfs-server ls /data
      register: _server_buckets_probe
      changed_when: false

    - name: Assert the probe bucket exists server-side
      ansible.builtin.assert:
        that: "'drift-probe' in _server_buckets_probe.stdout_lines"

    # ---- 5. versioning suspend branch ----
    - name: Converge with the probe bucket set to versioning false
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state
      vars:
        rustfs_state_buckets: "{{ rustfs_molecule_buckets_base + [_probe_suspended] }}"

    - name: Assert the suspend branch converged (exact set)
      ansible.builtin.assert:
        that:
          - rustfs_state_changes == ['rustfs-molecule:bucket:drift-probe:versioning:suspend']
        fail_msg: "unexpected change set: {{ rustfs_state_changes }}"

    # ---- 6. unmanaged reporting: report -> escalate -> silence ----
    # Inject an out-of-band EXTRA attachment with the rc install
    # side_effect left behind. rc has no detach, so this entry can never
    # be remediated server-side — the allowlist is the only way out, which
    # is exactly what this phase proves.
    - name: Attach an out-of-band builtin policy to app-user
      ansible.builtin.command: /tmp/molecule-rustfs-drift/rc admin policy attach drift readonly --user app-user
      environment:
        XDG_CONFIG_HOME: /tmp/molecule-rustfs-drift/xdg
      changed_when: true

    # The out-of-band attach REPLACED app-user's set (server quirk), so the
    # first converge must re-attach app-rw via the union — proving both the
    # repair and that the extra survives it.
    - name: Converge the original spec (probe bucket + extra attachment now unmanaged)
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state

    - name: Assert the wiped attachment was repaired and both extras are reported
      ansible.builtin.assert:
        that:
          - rustfs_state_changes == ['rustfs-molecule:user:app-user:attach:app-rw']
          - rustfs_state_unmanaged | sort == [
              'rustfs-molecule:bucket:drift-probe',
              'rustfs-molecule:user:app-user:extra-attachment:readonly',
            ] | sort
        fail_msg: >-
          unmanaged reporting broken: changes={{ rustfs_state_changes }}
          unmanaged={{ rustfs_state_unmanaged }}

    - name: Converge again (union attach must be stable)
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state

    - name: Assert the union attach converged with extras intact
      ansible.builtin.assert:
        that:
          - rustfs_state_changes | length == 0
          - rustfs_state_unmanaged | sort == [
              'rustfs-molecule:bucket:drift-probe',
              'rustfs-molecule:user:app-user:extra-attachment:readonly',
            ] | sort
        fail_msg: >-
          union attach not stable: changes={{ rustfs_state_changes }}
          unmanaged={{ rustfs_state_unmanaged }}

    - name: Escalation gate — fail_on_unmanaged must turn the report into a failure
      block:
        - name: Run role with fail_on_unmanaged
          ansible.builtin.include_role:
            name: david_igou.rustfs_configuration.rustfs_state
          vars:
            rustfs_state_fail_on_unmanaged: true

        - name: Unreachable — the unmanaged gate must have failed above
          ansible.builtin.fail:
            msg: fail_on_unmanaged passed despite an unmanaged bucket
      rescue:
        - name: Assert the failure was the unmanaged gate, with both entries
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail on unmanaged server-side resources (opt-in gate)'
              - "'rustfs-molecule:bucket:drift-probe' in rustfs_state_unmanaged"
              - "'rustfs-molecule:user:app-user:extra-attachment:readonly' in rustfs_state_unmanaged"
            fail_msg: "role failed for an unexpected reason: {{ ansible_failed_task.name | default('?') }}"

    - name: Run role with the probe allowlisted via ignore_unmanaged
      ansible.builtin.include_role:
        name: david_igou.rustfs_configuration.rustfs_state
      vars:
        rustfs_state_fail_on_unmanaged: true
        rustfs_state_ignore_unmanaged:
          - bucket:drift-probe
          - user:app-user:extra-attachment:readonly

    - name: Assert the allowlisted probe is silenced
      ansible.builtin.assert:
        that:
          - rustfs_state_unmanaged | length == 0
        fail_msg: "ignore_unmanaged broken: {{ rustfs_state_unmanaged }}"

    - name: Read server-side bucket directories after unmanaged runs
      ansible.builtin.command: podman exec rustfs-server ls /data
      register: _server_buckets_final
      changed_when: false

    - name: Assert the unmanaged bucket was never deleted
      ansible.builtin.assert:
        that: "'drift-probe' in _server_buckets_final.stdout_lines"

    # ---- 7. liveness failure path ----
    - name: Liveness failure path — wrong provided secret must fail the play
      block:
        - name: Run role with a bad user secret
          ansible.builtin.include_role:
            name: david_igou.rustfs_configuration.rustfs_state
          vars:
            rustfs_state_users:
              - name: app-user
                policies:
                  - app-rw
                secret_key: definitely-not-the-secret
                liveness_bucket: app-data

        - name: Unreachable — the role must have failed above
          ansible.builtin.fail:
            msg: liveness check passed with a wrong secret
      rescue:
        - name: Assert the failure was the liveness assert
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail on dead credentials (credential store vs server divergence)'
              - "'rustfs-molecule:user:app-user' in rustfs_state_liveness_failures"
            fail_msg: "role failed for an unexpected reason: {{ ansible_failed_task.name | default('?') }}"

    # ---- 8. error classification: network retries, auth fast-fails ----
    # The modules retry ONLY transport-level failures and fast-fail every
    # permanent class (auth/not-found/conflict). These two paths are what
    # that classification turns on, and both are deterministic.

    # 8a — a reachable endpoint with a WRONG admin secret is an auth error
    # (SignatureDoesNotMatch); the probe module reports authenticated=false
    # without retrying and the role must fail at the credential assert.
    - name: Exit-4 path — bad admin credentials fast-fail without retrying
      block:
        - name: Run role with a wrong admin secret against the live server
          ansible.builtin.include_role:
            name: david_igou.rustfs_configuration.rustfs_state
          vars:
            rustfs_state_admin_secret_key: definitely-not-the-admin-secret
            rustfs_state_policies: []
            rustfs_state_buckets: []
            rustfs_state_users: []
            rustfs_state_retries: 3
            rustfs_state_retry_delay: 1

        - name: Unreachable — the credential assert must have failed above
          ansible.builtin.fail:
            msg: bad admin credentials did not fail the run

      rescue:
        - name: Assert it failed fast at the rejected-credentials assert
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Fail on rejected admin credentials'
            fail_msg: >-
              expected the rejected-credentials assert, got:
              {{ ansible_failed_task.name | default('?') }}

    # 8b — an unreachable endpoint is a network-class error; the probe
    # module consumes its retry budget and then fails ITSELF (a connection
    # error, not a credential verdict). Reaching the probe task's own
    # failure — not the credential assert — proves the network class went
    # down the retryable branch.
    - name: Network path — an unreachable endpoint is retried, then surfaced as non-auth
      block:
        - name: Run role against an unreachable endpoint with a small retry budget
          ansible.builtin.include_role:
            name: david_igou.rustfs_configuration.rustfs_state
          vars:
            rustfs_state_endpoint: http://127.0.0.1:9099
            rustfs_state_policies: []
            rustfs_state_buckets: []
            rustfs_state_users: []
            rustfs_state_retries: 2
            rustfs_state_retry_delay: 1

        - name: Unreachable — the admin probe must have failed above
          ansible.builtin.fail:
            msg: an unreachable endpoint did not fail the run

      rescue:
        - name: Assert the network error was retried and surfaced as a non-credential error
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Validate admin credentials'
            fail_msg: >-
              expected the admin probe's own network failure (retried),
              got: {{ ansible_failed_task.name | default('?') }}

    - name: Remove the side-effect rc workdir
      ansible.builtin.file:
        path: /tmp/molecule-rustfs-drift
        state: absent

---
all:
  children:
    # Provisioner-managed test infrastructure: the RustFS server container.
    # No play targets this host directly — the provisioner force-writes its
    # connection settings, and the role reaches the published port instead.
    molecule:
      hosts:
        rustfs-server:
          mp:
            podman:
              # Exact live-validated server version (Renovate-tracked).
              # `command` is set EXPLICITLY to the image Cmd (`rustfs`
              # behind /entrypoint.sh): the provisioner's role-default
              # /sbin/init would otherwise clobber the entrypoint and the
              # server would never start.
              image: docker.io/rustfs/rustfs:1.0.0-beta.8
              command: rustfs
              env:
                RUSTFS_ACCESS_KEY: "{{ rustfs_molecule_admin_access_key }}"
                RUSTFS_SECRET_KEY: "{{ rustfs_molecule_admin_secret_key }}"
              published_ports:
                - "127.0.0.1:9100:9000"
    # NOT provisioner-managed: the connection-local stub the role runs on,
    # shaped exactly like a production instance stub host.
    stubs:
      hosts:
        rustfs-molecule:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

---
# Desired state for the stub host (the instance under test), in the role's
# flat per-host shape — the same layout production host_vars use.
rustfs_state_endpoint: http://127.0.0.1:9100
rustfs_state_admin_access_key: "{{ rustfs_molecule_admin_access_key }}"
rustfs_state_admin_secret_key: "{{ rustfs_molecule_admin_secret_key }}"

rustfs_state_policies:
  - name: app-rw
    document:
      ID: ""
      Version: "2012-10-17"
      Statement:
        - Sid: ListAndDescribeBucket
          Effect: Allow
          Condition: {}
          Action:
            - s3:ListBucket
            - s3:GetBucketLocation
            - s3:ListBucketMultipartUploads
          Resource:
            - arn:aws:s3:::app-data
        - Sid: ReadWriteDeleteObjects
          Effect: Allow
          Condition: {}
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:AbortMultipartUpload
            - s3:ListMultipartUploadParts
          Resource:
            - arn:aws:s3:::app-data/*
  # Estate pattern (README): each bucket gets its own scoped policy.
  - name: logs-rw
    document:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::app-logs
            - arn:aws:s3:::app-logs/*
  - name: archive-ro
    document:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetObject
          Resource:
            - arn:aws:s3:::app-archive
            - arn:aws:s3:::app-archive/*

# Named base so verify.yml can compose spec variants without recursive
# self-reference.
rustfs_molecule_buckets_base:
  - name: app-data
    versioning: false
  - name: app-backups
    versioning: true
    lifecycle:
      # Standard S3 API shape (PascalCase). IDs are optional (the module
      # generates deterministic ones); comparison ignores id churn either
      # way. One rule keeps an explicit ID to cover both paths.
      rules:
        - ID: 11111111-1111-1111-1111-111111111111
          Status: Enabled
          Prefix: backups/
          NoncurrentVersionExpiration:
            NoncurrentDays: 14
        - Status: Enabled
          Prefix: archive/
          NoncurrentVersionExpiration:
            NoncurrentDays: 90
  # Non-versioned logs bucket: CURRENT-object expiry (Expiration.Days) —
  # the README's "logs bucket" shape, distinct from noncurrent expiry.
  - name: app-logs
    versioning: false
    lifecycle:
      rules:
        - Status: Enabled
          Expiration:
            Days: 14
  # Versioned archive bucket: Date-based expiry on a prefix — covers the
  # Date canonicalization path (datetime vs string) against a live server.
  - name: app-archive
    versioning: true
    lifecycle:
      rules:
        - Status: Enabled
          Prefix: cold/
          Expiration:
            Date: "2030-01-01T00:00:00Z"

rustfs_state_buckets: "{{ rustfs_molecule_buckets_base }}"

rustfs_state_users:
  - name: app-user
    policies:
      - app-rw
    secret_key: "{{ rustfs_molecule_user_secret_key }}"
    liveness_bucket: app-data
  # Second user with a distinct policy set: multi-user attach coverage.
  - name: log-writer
    policies:
      - logs-rw
    secret_key: "{{ rustfs_molecule_writer_secret_key }}"
    liveness_bucket: app-logs

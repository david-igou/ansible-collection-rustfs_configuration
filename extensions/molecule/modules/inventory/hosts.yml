---
all:
  children:
    # Provisioner-managed test infrastructure: the RustFS server container
    # (own name + port so a leaked default-scenario container can't alias).
    molecule:
      hosts:
        rustfs-server-modules:
          mp:
            podman:
              image: docker.io/rustfs/rustfs:1.0.0-beta.8
              command: rustfs
              env:
                RUSTFS_ACCESS_KEY: "{{ rustfs_molecule_admin_access_key }}"
                RUSTFS_SECRET_KEY: "{{ rustfs_molecule_admin_secret_key }}"
              published_ports:
                - "127.0.0.1:9101:9000"
    # Connection-local stub the module walk runs on.
    stubs:
      hosts:
        rustfs-modules:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

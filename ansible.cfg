# Committed so collection resolution and connection timeouts are
# reproducible regardless of a contributor's shell environment. Molecule
# auto-installs the collection under test into this path before each run,
# which is what makes the FQCN role resolvable — do NOT point
# collections_path at the checkout's own parent tree (ansible-galaxy
# install --force would then resolve the install target to the source and
# delete it).
[defaults]
collections_path = ~/.ansible/collections

[persistent_connection]
connect_timeout = 120
command_timeout = 120

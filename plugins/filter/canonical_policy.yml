---
DOCUMENTATION:
  name: canonical_policy
  version_added: 2.0.0
  short_description: Canonicalize a RustFS IAM policy document for comparison
  description:
    - Sorts C(Action)/C(Resource) lists inside each statement, drops the empty
      C(Condition), C(Sid) and C(ID) fields the server injects on store, and
      orders statements deterministically.
    - Dropping the empty boilerplate is what lets a from-scratch policy
      document (naturally written without C(ID)/C(Sid)/C(Condition)) converge
      to steady state instead of re-applying C(update) every run.
    - RustFS returns policy arrays in a different order on every call (they
      are stored as sets); passing both sides of a comparison through this
      filter prevents false drift.
  positional: _input
  options:
    _input:
      description: IAM policy document.
      type: dict
      required: true

EXAMPLES: |
  - name: Compare a live policy against the spec
    ansible.builtin.set_fact:
      matches: >-
        {{ (live_doc | david_igou.rustfs.canonical_policy)
           == (spec_doc | david_igou.rustfs.canonical_policy) }}

RETURN:
  _value:
    description: The canonicalized policy document.
    type: dict

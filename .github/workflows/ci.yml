---
name: CI

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@v1.1.0
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@v1.1.0
  units:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@v1.1.0
  molecule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout into the canonical collection path
        uses: actions/checkout@v4
        with:
          path: ansible_collections/david_igou/rustfs

      - name: Install test requirements
        # botocore: runtime dependency of the collection's rustfs_* modules
        # (requirements.txt) — the role's stub hosts execute them on this
        # runner's python.
        run: pip install "molecule>=25" ansible-core ansible-lint botocore

      - name: Run molecule (podman backend)
        working-directory: ansible_collections/david_igou/rustfs
        run: make test

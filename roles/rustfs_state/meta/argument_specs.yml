---
argument_specs:
  main:
    short_description: Reconcile one RustFS instance's in-server state against a declarative spec
    description:
      - Reconciles IAM policies, buckets, versioning, lifecycle rules, users and
        policy attachments on the RustFS instance this host represents (a
        connection-local stub named after the instance; the role reaches
        I(rustfs_state_endpoint) itself via the pinned rc CLI), and verifies
        that the provided per-user credentials actually authenticate.
      - The role is a pure function over its inputs. Every credential arrives
        as a resolved value — the role performs no secret lookups; secret-store
        lookup expressions belong in the caller's data (host_vars).
      - Run with C(--check) for drift-detection mode (reads execute, mutations
        do not, and the play fails on any drift or dead credential).
    options:
      rustfs_state_endpoint:
        description:
          - Base URL of the instance (C(https://host:port)). C(http://) is
            also accepted for a plain-HTTP dev/test instance.
        type: str
        required: true
      rustfs_state_admin_access_key:
        description:
          - Resolved admin/root access key.
          - Kept C(no_log) although an access key identifies rather than
            authenticates — it never needs to appear in output, so it never
            does.
        type: str
        required: true
        no_log: true
      rustfs_state_admin_secret_key:
        description: Resolved admin/root secret key.
        type: str
        required: true
        no_log: true
      rustfs_state_alias:
        description:
          - rc alias for this instance; also prefixes the per-user liveness
            aliases (C(live-<alias>-<user>)). Reports always use
            C(inventory_hostname).
          - Must match C(^[a-z0-9][a-z0-9-]*$) — asserted early; dots and
            uppercase break rc alias/path parsing.
        type: str
        default: "{{ inventory_hostname }}"
      rustfs_state_tls_insecure:
        description:
          - Allow insecure TLS (self-signed / private-CA) on both alias
            registrations. TLS-only — a no-op for C(http://) endpoints.
        type: bool
        default: false
      rustfs_state_policies:
        description: Managed IAM policies.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Policy name.
            type: str
            required: true
          document:
            description:
              - IAM policy document (free-form dict). Write it the natural
                way — a C(Version) plus a C(Statement) list of
                C(Effect)/C(Action)/C(Resource) entries; no document-level
                C(ID) or per-statement C(Sid)/C(Condition) boilerplate is
                needed. The server injects those empties on store and the
                canonical-comparison filter absorbs them (along with array
                ordering), so a from-scratch document converges to steady
                state.
              - 'Minimal example:'
              - '  Version: "2012-10-17"'
              - '  Statement:'
              - '    - Effect: Allow'
              - '      Action: [s3:GetObject, s3:PutObject, s3:ListBucket]'
              - '      Resource: [arn:aws:s3:::app-data, arn:aws:s3:::app-data/*]'
            type: dict
            required: true
      rustfs_state_buckets:
        description: Managed buckets.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Bucket name.
            type: str
            required: true
          versioning:
            description: Desired versioning state. Omit (or set null) to leave unmanaged.
            type: bool
          lifecycle:
            description: Lifecycle configuration. Omit to leave unmanaged.
            type: dict
            options:
              rules:
                description:
                  - Lifecycle rules — the C(rules) ARRAY only, not the
                    rules-wrapper object that C(rc ilm rule export) prints.
                    Every rule MUST carry an C(id) (import rejects id-less
                    rules); ids are ignored in drift comparison. An empty list
                    is rejected (clear-all semantics unverified on the server)
                    — omit C(lifecycle) to leave rules unmanaged.
                  - To scope a rule to a path, use a top-level C(prefix) key
                    (for example C(prefix) of C(logs/)). The server honours
                    ONLY a top-level prefix; a nested C(filter) is silently
                    dropped on export, so a rule using one reports drift on
                    every run. An empty prefix (whole bucket) may be omitted.
                  - >-
                    Two whole-bucket retention shapes cover most needs.
                    Expire CURRENT objects N days after creation (typical for
                    a non-versioned bucket — logs, cluster backups):
                  - '  - id: expire-objects-30d'
                  - '    status: Enabled'
                  - '    expiration:'
                  - '      days: 30'
                  - >-
                    Expire NONCURRENT versions N days after they become
                    noncurrent (a versioned bucket — keeps the live object,
                    prunes old versions):
                  - '  - id: expire-noncurrent-30d'
                  - '    status: Enabled'
                  - '    noncurrentVersionExpiration:'
                  - '      noncurrentDays: 30'
                type: list
                elements: dict
                required: true
      rustfs_state_users:
        description:
          - Managed IAM users; a user's name is its access key.
          - Every entry's C(policies) list is pre-asserted against managed
            plus builtin policy names, so a typo fails fast with a clear
            message.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Access key (identity) of the user on the server.
            type: str
            required: true
          policies:
            description: Policy names to attach (add-only; no detach exists in rc 0.1.x).
            type: list
            elements: str
            default: []
          secret_key:
            description: >-
              Resolved secret key. Required when the user may need to be
              created and for the liveness check. Never rewritten for an
              existing user.
            type: str
            no_log: true
          access_key:
            description: >-
              Access key to use for the liveness check, as stored in the
              credential store (defaults to C(name)). A mismatch with the
              server identity is exactly what liveness detects.
            type: str
          liveness_bucket:
            description: >-
              Bucket to list with the provided credentials each run; enables
              the credential-liveness check.
            type: str
      rustfs_state_rc_version:
        description: Pinned rc CLI version. Bump together with the checksum.
        type: str
        default: "0.1.25"
      rustfs_state_rc_checksum:
        description: >-
          sha256 of the pinned rc release tarball for this version and arch.
          Required together with I(rustfs_state_rc_version) — a stale value
          fails safe as a checksum-mismatch on download.
        type: str
      rustfs_state_rc_arch:
        description: Architecture segment of the rc tarball name; the checksum must match.
        type: str
        default: amd64
      rustfs_state_rc_url:
        description: Download URL of the pinned rc tarball.
        type: str
      rustfs_state_rc_binary:
        description: Path to a pre-installed rc binary; empty downloads the pin.
        type: str
        default: ""
      rustfs_state_retries:
        description: Retries per rc call; only network-classified errors retry.
        type: int
        default: 8
      rustfs_state_retry_delay:
        description: Delay in seconds between retries.
        type: int
        default: 3
      rustfs_state_builtin_policies:
        description: Server-shipped policies never reported as unmanaged.
        type: list
        elements: str
        default: [readonly, readwrite, writeonly, diagnostics, consoleAdmin]
      rustfs_state_fail_on_drift:
        description: >-
          Fail the play when any change is (or would be) made. Defaults to
          the check-mode flag, which makes C(--check) the drift-detection
          mode.
        type: bool
      rustfs_state_fail_on_unmanaged:
        description: >-
          Escalate unmanaged server-side resources from a report to a
          failure. Nothing is ever deleted either way.
        type: bool
        default: false
      rustfs_state_ignore_unmanaged:
        description:
          - Allowlist of report entries (without the hostname prefix)
            excluded from the unmanaged report and gate.
          - Shapes are C(<kind>:<name>) (for example C(bucket:scratch)) and,
            for out-of-band policy attachments — which rc cannot detach —
            the exact C(user:<name>:extra-attachment:<policy[+policy...]>)
            entry as reported.
        type: list
        elements: str
        default: []

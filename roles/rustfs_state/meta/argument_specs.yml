---
argument_specs:
  main:
    short_description: Reconcile one RustFS instance's in-server state against a declarative spec
    description:
      - Reconciles IAM policies, buckets, versioning, lifecycle rules, users and
        policy attachments on the RustFS instance this host represents (a
        connection-local stub named after the instance; the role reaches
        I(rustfs_state_endpoint) through the collection's rustfs_* modules —
        direct S3 and admin-API calls, no rc CLI), and verifies that the
        provided per-user credentials actually authenticate.
      - The role is a pure function over its inputs. Every credential arrives
        as a resolved value — the role performs no secret lookups; secret-store
        lookup expressions belong in the caller's data (host_vars).
      - Run with C(--check) for drift-detection mode (reads execute, mutations
        do not, and the play fails on any drift or dead credential).
    options:
      rustfs_state_endpoint:
        description:
          - Base URL of the instance (C(https://host:port)). C(http://) is
            also accepted for a plain-HTTP dev/test instance.
        type: str
        required: true
      rustfs_state_admin_access_key:
        description:
          - Resolved admin/root access key.
          - Secret-adjacent — supply via your secret store. The modules the
            role calls never print it.
        type: str
        required: true
      rustfs_state_admin_secret_key:
        description: >-
          Resolved admin/root secret key. Secret — supply via your secret
          store; the modules mark it C(no_log) everywhere it flows.
        type: str
        required: true
      rustfs_state_tls_insecure:
        description:
          - Allow insecure TLS (self-signed certificate without a CA bundle).
            TLS-only — a no-op for C(http://) endpoints.
        type: bool
        default: false
      rustfs_state_ca_bundle:
        description:
          - Path to a CA bundle for private-CA endpoints. Empty uses the
            system trust store.
        type: str
        default: ""
      rustfs_state_policies:
        description: Managed IAM policies.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Policy name.
            type: str
            required: true
          document:
            description:
              - IAM policy document (free-form dict). Write it the natural
                way — a C(Version) plus a C(Statement) list of
                C(Effect)/C(Action)/C(Resource) entries; no document-level
                C(ID) or per-statement C(Sid)/C(Condition) boilerplate is
                needed. The server injects those empties on store and the
                canonical comparison absorbs them (along with array
                ordering), so a from-scratch document converges to steady
                state.
              - 'Minimal example:'
              - '  Version: "2012-10-17"'
              - '  Statement:'
              - '    - Effect: Allow'
              - '      Action: [s3:GetObject, s3:PutObject, s3:ListBucket]'
              - '      Resource: [arn:aws:s3:::app-data, arn:aws:s3:::app-data/*]'
            type: dict
            required: true
      rustfs_state_buckets:
        description: Managed buckets.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Bucket name.
            type: str
            required: true
          versioning:
            description: Desired versioning state. Omit (or set null) to leave unmanaged.
            type: bool
          lifecycle:
            description: Lifecycle configuration. Omit to leave unmanaged.
            type: dict
            options:
              rules:
                description:
                  - Lifecycle rules in the standard S3 API shape (PascalCase
                    keys — C(Status), C(Prefix), C(Expiration), ...), as any
                    S3 tool documents them. An C(ID) is optional; rules
                    without one get a deterministic generated ID. An empty
                    list is rejected (the role never deletes) — omit
                    C(lifecycle) to leave rules unmanaged.
                  - To scope a rule to a path, use a top-level C(Prefix) key
                    (for example C(Prefix) of C(logs/)) — the shape proven
                    live. A nested C(Filter) round-trips over the S3 API,
                    but whether the beta-8 expiry scanner honours it at
                    execution time is unverified. An empty prefix (whole
                    bucket) may be omitted.
                  - >-
                    Two whole-bucket retention shapes cover most needs.
                    Expire CURRENT objects N days after creation (typical for
                    a non-versioned bucket — logs, cluster backups):
                  - '  - Status: Enabled'
                  - '    Expiration:'
                  - '      Days: 30'
                  - >-
                    Expire NONCURRENT versions N days after they become
                    noncurrent (a versioned bucket — keeps the live object,
                    prunes old versions):
                  - '  - Status: Enabled'
                  - '    NoncurrentVersionExpiration:'
                  - '      NoncurrentDays: 30'
                type: list
                elements: dict
                required: true
      rustfs_state_users:
        description:
          - Managed IAM users; a user's name is its access key.
          - Every entry's C(policies) list is pre-asserted against managed
            plus builtin policy names, so a typo fails fast with a clear
            message.
        type: list
        elements: dict
        default: []
        options:
          name:
            description: Access key (identity) of the user on the server.
            type: str
            required: true
          policies:
            description: >-
              Policy names to attach (add-only; the role never detaches —
              extras are reported as unmanaged).
            type: list
            elements: str
            default: []
          secret_key:
            description: >-
              Resolved secret key. Required when the user may need to be
              created and for the liveness check. Never rewritten for an
              existing user. Secret — supply via your secret store; the
              modules mark it C(no_log) everywhere it flows.
            type: str
          access_key:
            description: >-
              Access key to use for the liveness check, as stored in the
              credential store (defaults to C(name)). A mismatch with the
              server identity is exactly what liveness detects.
            type: str
          liveness_bucket:
            description: >-
              Bucket to list with the provided credentials each run; enables
              the credential-liveness check.
            type: str
      rustfs_state_retries:
        description: >-
          Total attempts per API call; only transport-level failures retry
          (connection refused/reset, timeouts, HTTP 502/503/504).
        type: int
        default: 8
      rustfs_state_retry_delay:
        description: Delay in seconds between retries.
        type: int
        default: 3
      rustfs_state_builtin_policies:
        description: Server-shipped policies never reported as unmanaged.
        type: list
        elements: str
        default: [readonly, readwrite, writeonly, diagnostics, consoleAdmin]
      rustfs_state_fail_on_drift:
        description: >-
          Fail the play when any change is (or would be) made. Defaults to
          the check-mode flag, which makes C(--check) the drift-detection
          mode.
        type: bool
      rustfs_state_fail_on_unmanaged:
        description: >-
          Escalate unmanaged server-side resources from a report to a
          failure. Nothing is ever deleted either way.
        type: bool
        default: false
      rustfs_state_ignore_unmanaged:
        description:
          - Allowlist of report entries (without the hostname prefix)
            excluded from the unmanaged report and gate.
          - Shapes are C(<kind>:<name>) (for example C(bucket:scratch)) and,
            for out-of-band policy attachments — which the role never
            detaches — the exact
            C(user:<name>:extra-attachment:<policy[+policy...]>) entry as
            reported.
        type: list
        elements: str
        default: []

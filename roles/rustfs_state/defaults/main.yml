---
# rc CLI pin — bump version and checksum TOGETHER (the checksum is of the
# release tarball for the pinned version+arch; a stale checksum fails safe
# as a red get_url). Renovate bumps the version; the checksum update is a
# documented manual step in the Renovate PR checklist.
rustfs_state_rc_version: "0.1.25"
rustfs_state_rc_checksum: "sha256:a2d359f9c1c934886e236eb264318bbab326cb67cfae718e3a5186c8cfae82fe"
# Architecture segment of the release tarball name. The checksum above
# matches THIS arch; change both together.
rustfs_state_rc_arch: amd64
rustfs_state_rc_url: >-
  https://github.com/rustfs/cli/releases/download/v{{ rustfs_state_rc_version
  }}/rustfs-cli-linux-{{ rustfs_state_rc_arch }}-v{{ rustfs_state_rc_version }}.tar.gz
# Path to a pre-installed rc binary (e.g. baked into an EE image). Empty
# string -> download the pinned tarball into the run's tempdir and verify
# the checksum.
rustfs_state_rc_binary: ""

# The RustFS admin API (/rustfs/admin/v3/*) intermittently refuses requests
# in bursts on 1.0.0-beta.8 while the S3 data path stays healthy, so every
# rc call retries — but ONLY on classified network errors (the rc error
# envelope reports details.type == "network_error"); permanent errors fail
# immediately.
rustfs_state_retries: 8
rustfs_state_retry_delay: 3

# rc alias for this instance. Also the prefix of the per-user liveness
# aliases (live-<alias>-<user>). Reports always use inventory_hostname.
# Charset-asserted early: dots/uppercase break rc's alias/path parsing.
rustfs_state_alias: "{{ inventory_hostname }}"

# Allow insecure TLS on both alias registrations (admin + per-user
# liveness) — for self-signed/private-CA endpoints.
rustfs_state_tls_insecure: false

# Policies shipped with the server — never reported as unmanaged.
rustfs_state_builtin_policies:
  - readonly
  - readwrite
  - writeonly
  - diagnostics
  - consoleAdmin

# Fail the play when drift is detected. Defaults to check-mode only: a
# nightly drift job runs the role with --check and must go red on drift,
# while a converge run fixes drift instead of failing on it.
rustfs_state_fail_on_drift: "{{ ansible_check_mode }}"

# Deletion safety is absolute (nothing is ever deleted), but unmanaged
# server-side resources can be escalated from a report to a failure —
# turning rogue out-of-band resources into a red nightly job.
rustfs_state_fail_on_unmanaged: false
# Allowlist of report entries (without the hostname prefix) excluded from
# both the unmanaged report and the fail_on_unmanaged gate. Shapes:
# "<kind>:<name>" (e.g. "bucket:scratch") and — for out-of-band policy
# attachments, which rc cannot detach — the exact
# "user:<name>:extra-attachment:<policy[+policy...]>" entry as reported.
rustfs_state_ignore_unmanaged: []

# ── REQUIRED, deliberately no default — a run without them must fail ──
# The role reconciles ONE instance: the inventory host it runs on (a
# connection-local stub named after the instance). Credentials arrive
# RESOLVED — the role performs no secret lookups (function-style
# interface; secret-store lookup expressions belong in the caller's data).
# rustfs_state_endpoint:          # https://host:port
# rustfs_state_admin_access_key:  # resolved admin/root access key
# rustfs_state_admin_secret_key:  # resolved admin/root secret key

# Managed resources; empty means "manage nothing of this type" (existing
# server-side resources are then reported as unmanaged, never touched).
rustfs_state_policies: []
rustfs_state_buckets: []
rustfs_state_users: []

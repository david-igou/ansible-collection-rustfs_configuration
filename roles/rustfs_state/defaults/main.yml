---
# Every RustFS API call the role makes (through the collection's rustfs_*
# modules) retries ONLY transport-level failures — connection refused/reset,
# timeouts, HTTP 502/503/504. The admin API (/rustfs/admin/v3/*) is known to
# refuse requests in bursts on 1.0.0-beta.8 while the S3 data path stays
# healthy. Permanent errors (auth/not-found/conflict/validation) fail fast.
rustfs_state_retries: 8
rustfs_state_retry_delay: 3

# Allow insecure TLS (self-signed certificate without a CA bundle) — for
# TLS endpoints only; http:// endpoints are unaffected.
rustfs_state_tls_insecure: false

# Path to a CA bundle for private-CA endpoints. Empty string -> system trust.
rustfs_state_ca_bundle: ""

# Policies shipped with the server — never reported as unmanaged.
rustfs_state_builtin_policies:
  - readonly
  - readwrite
  - writeonly
  - diagnostics
  - consoleAdmin

# Fail the play when drift is detected. Defaults to check-mode only: a
# nightly drift job runs the role with --check and must go red on drift,
# while a converge run fixes drift instead of failing on it.
rustfs_state_fail_on_drift: "{{ ansible_check_mode }}"

# Deletion safety is absolute (the role never deletes anything), but
# unmanaged server-side resources can be escalated from a report to a
# failure — turning rogue out-of-band resources into a red nightly job.
rustfs_state_fail_on_unmanaged: false
# Allowlist of report entries (without the hostname prefix) excluded from
# both the unmanaged report and the fail_on_unmanaged gate. Shapes:
# "<kind>:<name>" (e.g. "bucket:scratch") and — for out-of-band policy
# attachments, which the role never detaches — the exact
# "user:<name>:extra-attachment:<policy[+policy...]>" entry as reported.
rustfs_state_ignore_unmanaged: []

# ── REQUIRED, deliberately no default — a run without them must fail ──
# The role reconciles ONE instance: the inventory host it runs on (a
# connection-local stub named after the instance). Credentials arrive
# RESOLVED — the role performs no secret lookups (function-style
# interface; secret-store lookup expressions belong in the caller's data).
# rustfs_state_endpoint:          # https://host:port
# rustfs_state_admin_access_key:  # resolved admin/root access key
# rustfs_state_admin_secret_key:  # resolved admin/root secret key

# Managed resources; empty means "manage nothing of this type" (existing
# server-side resources are then reported as unmanaged, never touched).
rustfs_state_policies: []
rustfs_state_buckets: []
rustfs_state_users: []

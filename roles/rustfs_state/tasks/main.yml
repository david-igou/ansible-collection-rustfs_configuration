---
# The role reconciles ONE RustFS instance: the inventory host it runs on
# (a connection-local stub named after the instance). inventory_hostname
# prefixes every report entry. All server access goes through the
# collection's rustfs_* modules (direct S3 + admin-API calls — no rc
# binary, no alias store, no tempdir).
#
# The modules support check mode natively: reads execute, mutations do
# not, so drift-detection (--check) needs no check_mode: false scaffolding.

# A liveness_bucket without a secret to test with would otherwise be
# silently skipped — that silence reads as "credential verified".
- name: Assert liveness-checked users provide a secret
  ansible.builtin.assert:
    that: >-
      rustfs_state_users | selectattr('liveness_bucket', 'defined')
      | rejectattr('secret_key', 'defined') | list | length == 0
    fail_msg: >-
      users with liveness_bucket but no secret_key:
      {{ rustfs_state_users | selectattr('liveness_bucket', 'defined')
         | rejectattr('secret_key', 'defined') | map(attribute='name') | join(', ') }}.
      Provide the resolved secret, or drop liveness_bucket.

# An empty rule list would be a lifecycle DELETION — the role never
# deletes; omit `lifecycle` to leave rules unmanaged. (Operators who
# really want to clear a bucket's lifecycle can call the
# bucket_lifecycle module with state=absent themselves.)
- name: Assert no bucket declares an empty lifecycle rule list
  ansible.builtin.assert:
    that: >-
      rustfs_state_buckets
      | selectattr('lifecycle', 'defined')
      | selectattr('lifecycle.rules', 'defined')
      | rejectattr('lifecycle.rules')
      | list | length == 0
    fail_msg: >-
      lifecycle.rules: [] is not allowed (the role never deletes) — omit
      the lifecycle key to leave rules unmanaged.

- name: Initialize run facts
  ansible.builtin.set_fact:
    rustfs_state_changes: []
    rustfs_state_unmanaged: []
    rustfs_state_liveness_failures: []
    rustfs_state_diffs: []

# Admin connection parameters for every module call in this run, delivered
# through the modules' RUSTFS_* environment fallbacks (the block below).
# Environment — unlike a module_defaults action group — needs no eager
# collection resolution, so ansible-lint's syntax-check works on an
# uninstalled checkout. ca_bundle is only present when set — an empty
# value must not reach the modules.
- name: Compose connection environment
  ansible.builtin.set_fact:
    _rustfs_state_env: >-
      {{ {'RUSTFS_ENDPOINT': rustfs_state_endpoint,
          'RUSTFS_ACCESS_KEY': rustfs_state_admin_access_key,
          'RUSTFS_SECRET_KEY': rustfs_state_admin_secret_key,
          'RUSTFS_VALIDATE_CERTS': (not (rustfs_state_tls_insecure | bool)) | string,
          'RUSTFS_RETRIES': rustfs_state_retries | string,
          'RUSTFS_RETRY_DELAY': rustfs_state_retry_delay | string}
         | combine(rustfs_state_ca_bundle
                   | ternary({'RUSTFS_CA_BUNDLE': rustfs_state_ca_bundle}, {})) }}
  no_log: true

- name: Reconcile RustFS state
  environment: "{{ _rustfs_state_env }}"
  block:
    # The same probe rc's `alias set` performed: proves the admin pair
    # authenticates (and can list) before any reconcile read. The explicit
    # endpoint arg (redundant with the environment) keeps the task args
    # non-empty — a bare module call makes ansible-lint's syntax-check
    # resolve the module eagerly, which fails on an uninstalled checkout.
    - name: Validate admin credentials
      david_igou.rustfs.credential_info:
        endpoint: "{{ rustfs_state_endpoint }}"
      register: _rustfs_state_admin_probe

    - name: Fail on rejected admin credentials
      ansible.builtin.assert:
        that: _rustfs_state_admin_probe.credential.usable
        fail_msg: >-
          the admin credentials for {{ rustfs_state_endpoint }} do not
          authenticate ({{ _rustfs_state_admin_probe.credential.detail }}).
          Secrets are never printed; check the resolved values in the
          caller's data.

    - name: Read buckets
      david_igou.rustfs.bucket_info:
        endpoint: "{{ rustfs_state_endpoint }}"
      register: _rustfs_state_bucket_read

    - name: Read policies
      david_igou.rustfs.policy_info:
        endpoint: "{{ rustfs_state_endpoint }}"
      register: _rustfs_state_policy_read

    - name: Read users
      david_igou.rustfs.user_info:
        endpoint: "{{ rustfs_state_endpoint }}"
      register: _rustfs_state_user_read

    - name: Parse current state
      ansible.builtin.set_fact:
        _rustfs_state_current_buckets: "{{ _rustfs_state_bucket_read.buckets }}"
        _rustfs_state_current_policies: "{{ _rustfs_state_policy_read.policies }}"
        _rustfs_state_current_users: "{{ _rustfs_state_user_read.users }}"

    - name: Assert managed user policies reference known policy names
      ansible.builtin.assert:
        that: >-
          (rustfs_state_users | map(attribute='policies', default=[]) | flatten)
          | difference(rustfs_state_policies | map(attribute='name') | list
                       + rustfs_state_builtin_policies
                       + _rustfs_state_current_policies)
          | length == 0
        fail_msg: >-
          users reference policies that are neither managed, builtin, nor
          present on the server:
          {{ (rustfs_state_users | map(attribute='policies', default=[]) | flatten)
             | difference(rustfs_state_policies | map(attribute='name') | list
                          + rustfs_state_builtin_policies
                          + _rustfs_state_current_policies) | join(', ') }}.
          A typo here would otherwise surface as a generic attach error
          deep in the reconcile.

    - name: Reconcile policies
      ansible.builtin.include_tasks: policy.yml
      loop: "{{ rustfs_state_policies }}"
      loop_control:
        loop_var: rustfs_state_policy
        label: "{{ rustfs_state_policy.name }}"

    - name: Reconcile buckets
      ansible.builtin.include_tasks: bucket.yml
      loop: "{{ rustfs_state_buckets }}"
      loop_control:
        loop_var: rustfs_state_bucket
        label: "{{ rustfs_state_bucket.name }}"

    - name: Reconcile users
      ansible.builtin.include_tasks: user.yml
      loop: "{{ rustfs_state_users }}"
      loop_control:
        loop_var: rustfs_state_user
        label: "{{ rustfs_state_user.name }}"

    # A user that is missing from the server in check mode is pending
    # creation (already reported as drift) — probing its credentials would
    # misreport a dead credential, so liveness skips it there. In a real
    # converge the user was just created, so the probe is valid.
    - name: Verify credential liveness
      ansible.builtin.include_tasks: liveness.yml
      loop: "{{ rustfs_state_users }}"
      loop_control:
        loop_var: rustfs_state_user
        label: "{{ rustfs_state_user.name }}"
      when:
        - rustfs_state_user.liveness_bucket is defined
        - rustfs_state_user.secret_key is defined
        - >-
          rustfs_state_user.name in (_rustfs_state_current_users | map(attribute='name') | list)
          or not ansible_check_mode

    # Deletion safety: resources on the server but absent from the spec
    # are REPORTED, never deleted. The ignore-list filters the WHOLE
    # accumulated report — including the user:<name>:extra-attachment:<p>
    # entries user.yml appended — from both the report and the
    # fail_on_unmanaged gate (the role never detaches policies).
    - name: Record unmanaged server-side resources
      vars:
        _rustfs_state_ignored: >-
          {{ rustfs_state_ignore_unmanaged
             | map('regex_replace', '^(.*)$', inventory_hostname ~ ':\1') | list }}
      ansible.builtin.set_fact:
        rustfs_state_unmanaged: >-
          {{ (rustfs_state_unmanaged
              + (_rustfs_state_current_buckets
                 | difference(rustfs_state_buckets | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':bucket:\1') | list)
              + (_rustfs_state_current_users | map(attribute='name') | list
                 | difference(rustfs_state_users | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':user:\1') | list)
              + (_rustfs_state_current_policies
                 | difference(rustfs_state_builtin_policies)
                 | difference(rustfs_state_policies | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':policy:\1') | list))
             | difference(_rustfs_state_ignored) }}

- name: Report reconcile summary
  ansible.builtin.debug:
    msg: >-
      {{ {'changes': rustfs_state_changes,
          'unmanaged_on_server': rustfs_state_unmanaged,
          'liveness_failures': rustfs_state_liveness_failures}
         | combine(ansible_diff_mode | ternary({'diffs': rustfs_state_diffs}, {})) }}

# Machine-consumable per-host export (stable API): automation platforms
# aggregate these across hosts.
- name: Export reconcile results as stats
  ansible.builtin.set_stats:
    data:
      rustfs_state_changes: "{{ rustfs_state_changes }}"
      rustfs_state_unmanaged_on_server: "{{ rustfs_state_unmanaged }}"
      rustfs_state_liveness_failures: "{{ rustfs_state_liveness_failures }}"
    per_host: true

# Gate order is deliberate: a dead credential is the failure the job
# status shows (all classes are in the emitted report above).
- name: Fail on dead credentials (credential store vs server divergence)
  ansible.builtin.assert:
    that: rustfs_state_liveness_failures | length == 0
    fail_msg: >-
      Provided credentials no longer authenticate against the server:
      {{ rustfs_state_liveness_failures | join(', ') }}.
      Check the resolved secret_key/access_key against the server (an
      out-of-band rotation or a stale secret-store item), and that each
      user's liveness_bucket exists and is listable by that user.

- name: Fail on unmanaged server-side resources (opt-in gate)
  ansible.builtin.assert:
    that: rustfs_state_unmanaged | length == 0
    fail_msg: >-
      Unmanaged resources present on the server:
      {{ rustfs_state_unmanaged | join(', ') }}.
      Adopt them into the spec, or allowlist via
      rustfs_state_ignore_unmanaged.
  when: rustfs_state_fail_on_unmanaged | bool

- name: Fail on drift (drift-detection mode)
  ansible.builtin.assert:
    that: rustfs_state_changes | length == 0
    fail_msg: "Drift detected: {{ rustfs_state_changes | join(', ') }}"
  when: rustfs_state_fail_on_drift | bool

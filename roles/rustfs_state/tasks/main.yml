---
# The role reconciles ONE RustFS instance: the inventory host it runs on
# (a connection-local stub named after the instance). inventory_hostname
# prefixes every report entry; rustfs_state_alias (default: the hostname)
# is the rc alias.
#
# check_mode: false throughout the scaffolding — drift-detection runs with
# --check and still needs the rc binary, the alias, and live reads to
# compute drift.

- name: Assert the rc alias is safe for rc path parsing
  ansible.builtin.assert:
    that: rustfs_state_alias is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: >-
      rustfs_state_alias '{{ rustfs_state_alias }}' must match
      ^[a-z0-9][a-z0-9-]*$ — dots and uppercase break rc alias/path
      parsing. Set rustfs_state_alias explicitly when the inventory
      hostname does not qualify.

# Names flow into rc command lines and rendered file paths — reject
# whitespace, flag-like leading '-', path separators and '..' up front so
# a bad spec fails with a clear message instead of a shredded-workdir
# escape or a shlex surprise.
- name: Assert managed resource names are safe for rc commands and paths
  ansible.builtin.assert:
    that:
      - >-
        (rustfs_state_policies | map(attribute='name') | list
         + rustfs_state_buckets | map(attribute='name') | list)
        | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9._-]*$') | list | length == 0
      - >-
        rustfs_state_users | map(attribute='name') | list
        | reject('match', '^[a-z0-9][a-z0-9-]*$') | list | length == 0
    fail_msg: >-
      policy/bucket names must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ and user
      names ^[a-z0-9][a-z0-9-]*$ (user names are embedded in rc liveness
      aliases, which reject dots and uppercase). Offending entries:
      {{ ((rustfs_state_policies | map(attribute='name') | list
           + rustfs_state_buckets | map(attribute='name') | list)
          | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9._-]*$') | list
          + (rustfs_state_users | map(attribute='name') | list
             | reject('match', '^[a-z0-9][a-z0-9-]*$') | list)) | join(', ') }}

# A liveness_bucket without a secret to test with would otherwise be
# silently skipped — that silence reads as "credential verified".
- name: Assert liveness-checked users provide a secret
  ansible.builtin.assert:
    that: >-
      rustfs_state_users | selectattr('liveness_bucket', 'defined')
      | rejectattr('secret_key', 'defined') | list | length == 0
    fail_msg: >-
      users with liveness_bucket but no secret_key:
      {{ rustfs_state_users | selectattr('liveness_bucket', 'defined')
         | rejectattr('secret_key', 'defined') | map(attribute='name') | join(', ') }}.
      Provide the resolved secret, or drop liveness_bucket.

# Clear-all semantics of `rc ilm rule import` with an empty rule list are
# UNVERIFIED on 1.0.0-beta.8 — forbid the ambiguous spec instead of
# guessing (omit `lifecycle` to leave rules unmanaged).
- name: Assert no bucket declares an empty lifecycle rule list
  ansible.builtin.assert:
    that: >-
      rustfs_state_buckets
      | selectattr('lifecycle', 'defined')
      | selectattr('lifecycle.rules', 'defined')
      | rejectattr('lifecycle.rules')
      | list | length == 0
    fail_msg: >-
      lifecycle.rules: [] is not allowed (clear-all semantics unverified
      on the server) — omit the lifecycle key to leave rules unmanaged.

# `rc ilm rule import` rejects any rule lacking an `id` (the export always
# emits one). A hand-written spec that omits it would otherwise fail deep
# in the import with a generic rc error — assert it up front.
- name: Assert every managed lifecycle rule carries an id
  ansible.builtin.assert:
    that: >-
      rustfs_state_buckets
      | selectattr('lifecycle', 'defined')
      | map(attribute='lifecycle.rules', default=[])
      | flatten
      | rejectattr('id', 'defined')
      | list | length == 0
    fail_msg: >-
      every lifecycle rule must carry an id (rc ilm rule import requires
      it; ids are ignored in drift comparison). Copy rules verbatim from
      `rc ilm rule export`.

- name: Create working directory (rc binary, alias store, rendered documents)
  ansible.builtin.tempfile:
    state: directory
    prefix: rustfs-state-
  register: _rustfs_state_workdir_result
  check_mode: false
  changed_when: false

- name: Reconcile RustFS state
  block:
    - name: Initialize run facts
      ansible.builtin.set_fact:
        _rustfs_state_workdir: "{{ _rustfs_state_workdir_result.path }}"
        _rustfs_state_env:
          XDG_CONFIG_HOME: "{{ _rustfs_state_workdir_result.path }}/xdg"
        rustfs_state_changes: []
        rustfs_state_unmanaged: []
        rustfs_state_liveness_failures: []
        rustfs_state_diffs: []

    - name: Install pinned rc CLI
      when: not rustfs_state_rc_binary
      check_mode: false
      block:
        - name: Download rc tarball (checksum-verified)
          ansible.builtin.get_url:
            url: "{{ rustfs_state_rc_url }}"
            dest: "{{ _rustfs_state_workdir }}/rc.tar.gz"
            checksum: "{{ rustfs_state_rc_checksum }}"
            mode: "0600"
          changed_when: false

        - name: Extract rc
          ansible.builtin.unarchive:
            src: "{{ _rustfs_state_workdir }}/rc.tar.gz"
            dest: "{{ _rustfs_state_workdir }}"
            remote_src: true
          changed_when: false

    - name: Resolve rc binary path
      ansible.builtin.set_fact:
        _rustfs_state_rc: "{{ rustfs_state_rc_binary | default(_rustfs_state_workdir ~ '/rc', true) }}"

    # `rc alias set` validates the pair against the endpoint (exit 4 on
    # rejected credentials), so this doubles as admin credential
    # validation. Retries only rc exit code 3 (NetworkError).
    - name: Register rc alias (validates admin credentials)
      vars:
        _rustfs_state_alias_argv:
          - "{{ _rustfs_state_rc }}"
          - alias
          - set
          - "{{ rustfs_state_alias }}"
          - "{{ rustfs_state_endpoint }}"
          - "{{ rustfs_state_admin_access_key }}"
          - "{{ rustfs_state_admin_secret_key }}"
      ansible.builtin.command:
        argv: "{{ _rustfs_state_alias_argv + (rustfs_state_tls_insecure | bool | ternary(['--insecure'], [])) }}"
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_alias_result
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_alias_result.rc != 3
      failed_when: false
      no_log: true
      check_mode: false
      changed_when: false

    - name: Fail on rejected admin credentials
      ansible.builtin.assert:
        that: _rustfs_state_alias_result.rc != 4
        fail_msg: >-
          rc rejected the admin credentials for alias
          {{ rustfs_state_alias }} ({{ rustfs_state_endpoint }}) — exit 4,
          invalid access key or secret key. Secrets are never printed;
          check the resolved values in the caller's data.

    - name: Fail on any other alias registration error
      ansible.builtin.assert:
        that: _rustfs_state_alias_result.rc == 0
        fail_msg: >-
          rc alias set failed for {{ rustfs_state_alias }}
          ({{ rustfs_state_endpoint }}) with rc={{ _rustfs_state_alias_result.rc }}
          after retries. Secrets are never printed; run with
          rustfs_state_retries=1 and inspect endpoint/TLS reachability.

    - name: Read buckets
      ansible.builtin.command: "{{ _rustfs_state_rc }} ls {{ rustfs_state_alias }} --json"
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_ls
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_ls.rc != 3
      check_mode: false
      changed_when: false

    - name: Read policies
      ansible.builtin.command: "{{ _rustfs_state_rc }} admin policy ls {{ rustfs_state_alias }} --json"
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_policy_ls
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_policy_ls.rc != 3
      check_mode: false
      changed_when: false

    - name: Read users
      ansible.builtin.command: "{{ _rustfs_state_rc }} admin user ls {{ rustfs_state_alias }} --json"
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_user_ls
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_user_ls.rc != 3
      check_mode: false
      changed_when: false

    - name: Parse current state
      ansible.builtin.set_fact:
        _rustfs_state_current_buckets: "{{ (_rustfs_state_ls.stdout | from_json)['items'] | default([]) | map(attribute='key') | list }}"
        _rustfs_state_current_policies: "{{ (_rustfs_state_policy_ls.stdout | from_json).policies | default([]) }}"
        _rustfs_state_current_users: "{{ (_rustfs_state_user_ls.stdout | from_json).users | default([]) }}"

    - name: Assert managed user policies reference known policy names
      ansible.builtin.assert:
        that: >-
          (rustfs_state_users | map(attribute='policies', default=[]) | flatten)
          | difference(rustfs_state_policies | map(attribute='name') | list
                       + rustfs_state_builtin_policies
                       + _rustfs_state_current_policies)
          | length == 0
        fail_msg: >-
          users reference policies that are neither managed, builtin, nor
          present on the server:
          {{ (rustfs_state_users | map(attribute='policies', default=[]) | flatten)
             | difference(rustfs_state_policies | map(attribute='name') | list
                          + rustfs_state_builtin_policies
                          + _rustfs_state_current_policies) | join(', ') }}.
          A typo here would otherwise burn the full retry budget inside
          `rc admin policy attach` and die with a generic error.

    - name: Reconcile policies
      ansible.builtin.include_tasks: policy.yml
      loop: "{{ rustfs_state_policies }}"
      loop_control:
        loop_var: rustfs_state_policy
        label: "{{ rustfs_state_policy.name }}"

    - name: Reconcile buckets
      ansible.builtin.include_tasks: bucket.yml
      loop: "{{ rustfs_state_buckets }}"
      loop_control:
        loop_var: rustfs_state_bucket
        label: "{{ rustfs_state_bucket.name }}"

    - name: Reconcile users
      ansible.builtin.include_tasks: user.yml
      loop: "{{ rustfs_state_users }}"
      loop_control:
        loop_var: rustfs_state_user
        label: "{{ rustfs_state_user.name }}"

    # A user that is missing from the server in check mode is pending
    # creation (already reported as drift) — probing its credentials would
    # misreport a dead credential, so liveness skips it there. In a real
    # converge the user was just created, so the probe is valid.
    - name: Verify credential liveness
      ansible.builtin.include_tasks: liveness.yml
      loop: "{{ rustfs_state_users }}"
      loop_control:
        loop_var: rustfs_state_user
        label: "{{ rustfs_state_user.name }}"
      when:
        - rustfs_state_user.liveness_bucket is defined
        - rustfs_state_user.secret_key is defined
        - >-
          rustfs_state_user.name in (_rustfs_state_current_users | map(attribute='accessKey') | list)
          or not ansible_check_mode

    # Deletion safety: resources on the server but absent from the spec
    # are REPORTED, never deleted. The ignore-list filters the WHOLE
    # accumulated report — including the user:<name>:extra-attachment:<p>
    # entries user.yml appended — from both the report and the
    # fail_on_unmanaged gate (extra attachments are otherwise permanent:
    # rc 0.1.x has no detach).
    - name: Record unmanaged server-side resources
      vars:
        _rustfs_state_ignored: >-
          {{ rustfs_state_ignore_unmanaged
             | map('regex_replace', '^(.*)$', inventory_hostname ~ ':\1') | list }}
      ansible.builtin.set_fact:
        rustfs_state_unmanaged: >-
          {{ (rustfs_state_unmanaged
              + (_rustfs_state_current_buckets
                 | difference(rustfs_state_buckets | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':bucket:\1') | list)
              + (_rustfs_state_current_users | map(attribute='accessKey') | list
                 | difference(rustfs_state_users | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':user:\1') | list)
              + (_rustfs_state_current_policies
                 | difference(rustfs_state_builtin_policies)
                 | difference(rustfs_state_policies | map(attribute='name') | list)
                 | map('regex_replace', '^(.*)$', inventory_hostname ~ ':policy:\1') | list))
             | difference(_rustfs_state_ignored) }}

  always:
    - name: Remove working directory (binary, alias store, rendered documents)
      ansible.builtin.file:
        path: "{{ _rustfs_state_workdir_result.path }}"
        state: absent
      check_mode: false
      changed_when: false

- name: Report reconcile summary
  ansible.builtin.debug:
    msg: >-
      {{ {'changes': rustfs_state_changes,
          'unmanaged_on_server': rustfs_state_unmanaged,
          'liveness_failures': rustfs_state_liveness_failures}
         | combine(ansible_diff_mode | ternary({'diffs': rustfs_state_diffs}, {})) }}

# Machine-consumable per-host export (stable API): automation platforms
# aggregate these across hosts.
- name: Export reconcile results as stats
  ansible.builtin.set_stats:
    data:
      rustfs_state_changes: "{{ rustfs_state_changes }}"
      rustfs_state_unmanaged_on_server: "{{ rustfs_state_unmanaged }}"
      rustfs_state_liveness_failures: "{{ rustfs_state_liveness_failures }}"
    per_host: true

# Gate order is deliberate: a dead credential is the failure the job
# status shows (all classes are in the emitted report above).
- name: Fail on dead credentials (credential store vs server divergence)
  ansible.builtin.assert:
    that: rustfs_state_liveness_failures | length == 0
    fail_msg: >-
      Provided credentials no longer authenticate against the server:
      {{ rustfs_state_liveness_failures | join(', ') }}

- name: Fail on unmanaged server-side resources (opt-in gate)
  ansible.builtin.assert:
    that: rustfs_state_unmanaged | length == 0
    fail_msg: >-
      Unmanaged resources present on the server:
      {{ rustfs_state_unmanaged | join(', ') }}.
      Adopt them into the spec, or allowlist via
      rustfs_state_ignore_unmanaged.
  when: rustfs_state_fail_on_unmanaged | bool

- name: Fail on drift (drift-detection mode)
  ansible.builtin.assert:
    that: rustfs_state_changes | length == 0
    fail_msg: "Drift detected: {{ rustfs_state_changes | join(', ') }}"
  when: rustfs_state_fail_on_drift | bool

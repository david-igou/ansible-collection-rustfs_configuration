---
# Reconcile one IAM policy (loop_var: rustfs_state_policy).
#
# Retries only rc exit code 3 (NetworkError). "not found" (exit 5) falls
# through immediately, so a missing policy is detected rather than retried
# to exhaustion.

- name: "Read current document for policy {{ rustfs_state_policy.name }}"
  ansible.builtin.command: >-
    {{ _rustfs_state_rc }} admin policy info
    {{ rustfs_state_alias }} {{ rustfs_state_policy.name }} --json
  environment: "{{ _rustfs_state_env }}"
  register: _rustfs_state_policy_info
  retries: "{{ rustfs_state_retries }}"
  delay: "{{ rustfs_state_retry_delay }}"
  until: _rustfs_state_policy_info.rc != 3
  failed_when: false
  check_mode: false
  changed_when: false

- name: "Compute drift for policy {{ rustfs_state_policy.name }}"
  ansible.builtin.set_fact:
    _rustfs_state_policy_exists: "{{ rustfs_state_policy.name in _rustfs_state_current_policies }}"
    _rustfs_state_policy_current: >-
      {{ ((_rustfs_state_policy_info.stdout | from_json).policy.policy
          | david_igou.rustfs_configuration.rustfs_canonical_policy)
         if _rustfs_state_policy_info.rc == 0 else none }}
    _rustfs_state_policy_desired: "{{ rustfs_state_policy.document | david_igou.rustfs_configuration.rustfs_canonical_policy }}"

- name: "Apply policy {{ rustfs_state_policy.name }}"
  when: _rustfs_state_policy_current != _rustfs_state_policy_desired
  block:
    - name: "Record change for policy {{ rustfs_state_policy.name }}"
      ansible.builtin.set_fact:
        rustfs_state_changes: >-
          {{ rustfs_state_changes
             + [inventory_hostname ~ ':policy:' ~ rustfs_state_policy.name ~ ':'
                ~ (_rustfs_state_policy_exists | bool | ternary('update', 'create'))] }}
        # Canonicalized desired-vs-current payload (secrets-free) — the
        # remediation UX for a drift job run with --diff.
        rustfs_state_diffs: >-
          {{ rustfs_state_diffs
             + [{'entry': inventory_hostname ~ ':policy:' ~ rustfs_state_policy.name,
                 'current': _rustfs_state_policy_current,
                 'desired': _rustfs_state_policy_desired}] }}

    - name: "Render document for policy {{ rustfs_state_policy.name }}"
      ansible.builtin.copy:
        content: "{{ rustfs_state_policy.document | to_nice_json }}"
        dest: "{{ _rustfs_state_workdir }}/policy-{{ rustfs_state_policy.name }}.json"
        mode: "0600"
      changed_when: false

    - name: "Create or update policy {{ rustfs_state_policy.name }}"
      ansible.builtin.command: >-
        {{ _rustfs_state_rc }} admin policy create
        {{ rustfs_state_alias }} {{ rustfs_state_policy.name }}
        {{ _rustfs_state_workdir }}/policy-{{ rustfs_state_policy.name }}.json
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_policy_apply
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_policy_apply.rc != 3
      changed_when: true

---
# Reconcile one IAM policy (loop_var: rustfs_state_policy). The module
# reads first, compares canonically (server echo injects empty
# boilerplate and reorders arrays), and writes only on mismatch.

- name: "Reconcile policy {{ rustfs_state_policy.name }}"
  david_igou.rustfs_configuration.rustfs_policy:
    name: "{{ rustfs_state_policy.name }}"
    document: "{{ rustfs_state_policy.document }}"
    state: present
  register: _rustfs_state_policy_result

# Keyed on the module's diff (emitted exactly when a write happened or is
# pending) rather than `is changed` — same semantics.
- name: "Record change for policy {{ rustfs_state_policy.name }}"
  when: _rustfs_state_policy_result.diff is defined
  ansible.builtin.set_fact:
    rustfs_state_changes: >-
      {{ rustfs_state_changes
         + [inventory_hostname ~ ':policy:' ~ rustfs_state_policy.name ~ ':'
            ~ ((rustfs_state_policy.name in _rustfs_state_current_policies)
               | ternary('update', 'create'))] }}
    # Canonicalized desired-vs-current payload (secrets-free) — the
    # remediation UX for a drift job run with --diff.
    rustfs_state_diffs: >-
      {{ rustfs_state_diffs
         + [{'entry': inventory_hostname ~ ':policy:' ~ rustfs_state_policy.name,
             'current': _rustfs_state_policy_result.diff.before.document | default(none),
             'desired': _rustfs_state_policy_result.diff.after.document}] }}

---
# Reconcile one IAM user (loop_var: rustfs_state_user): existence and
# policy attachments. The user's name IS its access key.
#
# Secret handling (function-style — the role never resolves secrets):
# - creation uses the RESOLVED `secret_key` provided in the spec; if it is
#   absent when the user needs creating, the module fails with
#   instructions. The role never generates credentials.
# - an EXISTING user's secret is never touched (the rustfs_user module
#   only rotates with an explicit update_secret opt-in, which the role
#   never sets) — rotation is a deliberate manual act, not a converge
#   side effect.

- name: "Compute state for user {{ rustfs_state_user.name }}"
  ansible.builtin.set_fact:
    _rustfs_state_user_exists: "{{ rustfs_state_user.name in (_rustfs_state_current_users | map(attribute='name') | list) }}"
    _rustfs_state_user_current_policies: >-
      {{ (_rustfs_state_current_users
          | selectattr('name', 'equalto', rustfs_state_user.name)
          | map(attribute='policies') | first) | default([]) }}

- name: "Reconcile user {{ rustfs_state_user.name }}"
  david_igou.rustfs.rustfs_user:
    name: "{{ rustfs_state_user.name }}"
    secret: "{{ rustfs_state_user.secret_key | default(omit) }}"
    state: present
  register: _rustfs_state_user_result

- name: "Record change for user {{ rustfs_state_user.name }}"
  when: not (_rustfs_state_user_exists | bool)
  ansible.builtin.set_fact:
    rustfs_state_changes: "{{ rustfs_state_changes + [inventory_hostname ~ ':user:' ~ rustfs_state_user.name ~ ':create'] }}"

# Server quirk (empirically confirmed on 1.0.0-beta.8): the attachment
# primitive REPLACES the user's whole policy set — it is not additive.
# The rustfs_policy_attachment module therefore reads the current set and
# writes the UNION of current + desired (exclusive=false): desired
# policies converge, out-of-band extras survive (deletion safety) and
# stay visible as extra-attachment reports below.
- name: "Attach missing policies to user {{ rustfs_state_user.name }}"
  vars:
    _rustfs_state_user_effective_current: "{{ _rustfs_state_user_exists | bool | ternary(_rustfs_state_user_current_policies, []) }}"
    _rustfs_state_user_missing_policies: >-
      {{ (rustfs_state_user.policies | default([]))
         | difference(_rustfs_state_user_effective_current) }}
  when: _rustfs_state_user_missing_policies | length > 0
  block:
    - name: "Record attachment change for user {{ rustfs_state_user.name }}"
      ansible.builtin.set_fact:
        rustfs_state_changes: >-
          {{ rustfs_state_changes
             + [inventory_hostname ~ ':user:' ~ rustfs_state_user.name ~ ':attach:'
                ~ (_rustfs_state_user_missing_policies | join('+'))] }}

    # Skipped when the user is pending creation in check mode — the
    # attachment (already recorded above) cannot be probed against a user
    # that does not exist yet.
    - name: "Attach policies to user {{ rustfs_state_user.name }}"
      david_igou.rustfs.rustfs_policy_attachment:
        user: "{{ rustfs_state_user.name }}"
        policies: "{{ rustfs_state_user.policies }}"
        exclusive: false
      when: _rustfs_state_user_exists | bool or not ansible_check_mode

# Policies attached on the server but absent from the spec are reported,
# never detached (the role never uses the module's exclusive mode).
- name: "Record extra attachments for user {{ rustfs_state_user.name }}"
  vars:
    _rustfs_state_user_extra_policies: >-
      {{ (_rustfs_state_user_exists | bool | ternary(_rustfs_state_user_current_policies, []))
         | difference(rustfs_state_user.policies | default([])) }}
  when: _rustfs_state_user_extra_policies | length > 0
  ansible.builtin.set_fact:
    rustfs_state_unmanaged: >-
      {{ rustfs_state_unmanaged
         + [inventory_hostname ~ ':user:' ~ rustfs_state_user.name ~ ':extra-attachment:'
            ~ (_rustfs_state_user_extra_policies | join('+'))] }}

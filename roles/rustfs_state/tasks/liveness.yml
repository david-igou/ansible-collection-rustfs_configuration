---
# Verify one user's provided credentials actually authenticate AND can
# list their liveness bucket (loop_var: rustfs_state_user; included only
# when liveness_bucket and secret_key are set — see the gate in main.yml).
#
# The pair is used exactly as provided by the caller (access_key defaults
# to the user's name; in production the caller resolves both from the
# secret store) — divergence between the credential store and the server
# is exactly what this catches (wedged server, stale item, out-of-band
# rotation). Failures are collected and the play fails after the full
# report.
#
# The probed pair OVERRIDES the admin credentials from the inherited
# RUSTFS_* environment (explicit module params beat env fallbacks);
# endpoint/TLS/retry settings are inherited. Unlike the rc CLI (which
# lumped a data-path AccessDenied in with network errors and retried it
# through the whole budget), the module distinguishes authentication from
# authorization and fails neither task — the verdict lands in `usable`.

- name: "Probe credential liveness for user {{ rustfs_state_user.name }}"
  david_igou.rustfs_configuration.rustfs_credential_info:
    access_key: "{{ rustfs_state_user.access_key | default(rustfs_state_user.name) }}"
    secret_key: "{{ rustfs_state_user.secret_key }}"
    bucket: "{{ rustfs_state_user.liveness_bucket }}"
  register: _rustfs_state_live_result
  failed_when: false

- name: "Record liveness failure for user {{ rustfs_state_user.name }}"
  when: not (_rustfs_state_live_result.credential.usable | default(false))
  ansible.builtin.set_fact:
    rustfs_state_liveness_failures: >-
      {{ rustfs_state_liveness_failures
         + [inventory_hostname ~ ':user:' ~ rustfs_state_user.name] }}

---
# Reconcile one bucket (loop_var: rustfs_state_bucket): existence,
# versioning (only when the `versioning` key is present), lifecycle rules
# (only when `lifecycle.rules` is present).
#
# `versioning is not none` as well as `is defined`: a bare `versioning:`
# (YAML null) means "leave unmanaged", same as omitting the key.

- name: "Reconcile bucket {{ rustfs_state_bucket.name }}"
  david_igou.rustfs.rustfs_bucket:
    name: "{{ rustfs_state_bucket.name }}"
    state: present
    versioning: >-
      {{ (rustfs_state_bucket.versioning | bool | ternary('enabled', 'suspended'))
         if (rustfs_state_bucket.versioning is defined
             and rustfs_state_bucket.versioning is not none)
         else omit }}
  register: _rustfs_state_bucket_result

- name: "Record creation change for bucket {{ rustfs_state_bucket.name }}"
  when: rustfs_state_bucket.name not in _rustfs_state_current_buckets
  ansible.builtin.set_fact:
    rustfs_state_changes: "{{ rustfs_state_changes + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':create'] }}"

# The module emits a diff exactly when the versioning state had to move.
- name: "Record versioning change for bucket {{ rustfs_state_bucket.name }}"
  when: _rustfs_state_bucket_result.diff is defined
  ansible.builtin.set_fact:
    rustfs_state_changes: >-
      {{ rustfs_state_changes
         + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':versioning:'
            ~ (rustfs_state_bucket.versioning | bool | ternary('enable', 'suspend'))] }}

- name: "Manage lifecycle for bucket {{ rustfs_state_bucket.name }}"
  when: rustfs_state_bucket.lifecycle.rules is defined
  block:
    # Full-replace reconcile (matching the server's own semantics); the
    # module compares canonically — rule IDs, empty scoping, and date
    # representations can never produce false drift — and generates
    # deterministic IDs for rules that omit one.
    - name: "Reconcile lifecycle of bucket {{ rustfs_state_bucket.name }}"
      david_igou.rustfs.rustfs_bucket_lifecycle:
        bucket: "{{ rustfs_state_bucket.name }}"
        rules: "{{ rustfs_state_bucket.lifecycle.rules }}"
        state: present
      register: _rustfs_state_ilm_result

    # Keyed on the module's diff (emitted exactly when a replace happened
    # or is pending) rather than `is changed` — same semantics.
    - name: "Record lifecycle change for bucket {{ rustfs_state_bucket.name }}"
      when: _rustfs_state_ilm_result.diff is defined
      ansible.builtin.set_fact:
        rustfs_state_changes: "{{ rustfs_state_changes + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':lifecycle:import'] }}"
        rustfs_state_diffs: >-
          {{ rustfs_state_diffs
             + [{'entry': inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':lifecycle',
                 'current': _rustfs_state_ilm_result.diff.before.rules,
                 'desired': _rustfs_state_ilm_result.diff.after.rules}] }}

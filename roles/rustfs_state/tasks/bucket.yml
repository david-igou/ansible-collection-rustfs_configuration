---
# Reconcile one bucket (loop_var: rustfs_state_bucket): existence,
# versioning (only when the `versioning` key is present), lifecycle rules
# (only when `lifecycle.rules` is present). Quotas are out of scope.
#
# Server quirk coded around: `rc mb` on an EXISTING bucket returns false
# success — existence is decided by the list-first read in main.yml, never
# by the create call.

- name: "Create bucket {{ rustfs_state_bucket.name }}"
  when: rustfs_state_bucket.name not in _rustfs_state_current_buckets
  block:
    - name: "Record change for bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.set_fact:
        rustfs_state_changes: "{{ rustfs_state_changes + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':create'] }}"

    - name: "Make bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.command: "{{ _rustfs_state_rc }} bucket create {{ rustfs_state_alias }}/{{ rustfs_state_bucket.name }}"
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_bucket_create
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_bucket_create.rc != 3
      changed_when: true

# `versioning is not none` as well as `is defined`: a bare `versioning:`
# (YAML null) means "leave unmanaged", same as omitting the key — and it
# keeps a None out of the `| bool` filter below (which emits a deprecation
# warning today and errors on ansible-core 2.23).
- name: "Manage versioning for bucket {{ rustfs_state_bucket.name }}"
  when:
    - rustfs_state_bucket.versioning is defined
    - rustfs_state_bucket.versioning is not none
  block:
    - name: "Read versioning of bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.command: >-
        {{ _rustfs_state_rc }} bucket version info
        {{ rustfs_state_alias }}/{{ rustfs_state_bucket.name }} --json
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_versioning
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_versioning.rc != 3
      failed_when: false
      check_mode: false
      changed_when: false

    # A bucket missing in check mode reads as unversioned. A freshly-created
    # bucket can report `enabled: null` (never-configured) — coerce that to
    # false rather than letting None flow through `| bool` (a deprecation
    # warning today, an error on ansible-core 2.23).
    - name: "Compute versioning drift for bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.set_fact:
        _rustfs_state_versioning_current: >-
          {{ _rustfs_state_versioning.rc == 0
             and ((_rustfs_state_versioning.stdout | from_json).enabled
                  | default(false, true) | bool) }}

    - name: "Converge versioning for bucket {{ rustfs_state_bucket.name }}"
      when: (_rustfs_state_versioning_current | bool) != (rustfs_state_bucket.versioning | bool)
      block:
        - name: "Record versioning change for bucket {{ rustfs_state_bucket.name }}"
          ansible.builtin.set_fact:
            rustfs_state_changes: >-
              {{ rustfs_state_changes
                 + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':versioning:'
                    ~ (rustfs_state_bucket.versioning | bool | ternary('enable', 'suspend'))] }}

        - name: "Set versioning on bucket {{ rustfs_state_bucket.name }}"
          ansible.builtin.command: >-
            {{ _rustfs_state_rc }} bucket version
            {{ rustfs_state_bucket.versioning | bool | ternary('enable', 'suspend') }}
            {{ rustfs_state_alias }}/{{ rustfs_state_bucket.name }}
          environment: "{{ _rustfs_state_env }}"
          register: _rustfs_state_versioning_set
          retries: "{{ rustfs_state_retries }}"
          delay: "{{ rustfs_state_retry_delay }}"
          until: _rustfs_state_versioning_set.rc != 3
          changed_when: true

- name: "Manage lifecycle for bucket {{ rustfs_state_bucket.name }}"
  when: rustfs_state_bucket.lifecycle.rules is defined
  block:
    - name: "Export lifecycle rules of bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.command: >-
        {{ _rustfs_state_rc }} ilm rule export
        {{ rustfs_state_alias }}/{{ rustfs_state_bucket.name }}
      environment: "{{ _rustfs_state_env }}"
      register: _rustfs_state_ilm
      retries: "{{ rustfs_state_retries }}"
      delay: "{{ rustfs_state_retry_delay }}"
      until: _rustfs_state_ilm.rc != 3
      failed_when: false
      check_mode: false
      changed_when: false

    # A bucket with no lifecycle configuration (or missing in check mode)
    # reads as an empty rule list. Comparison strips server-generated rule
    # ids on both sides; import is a full replace and REQUIRES ids.
    - name: "Compute lifecycle drift for bucket {{ rustfs_state_bucket.name }}"
      ansible.builtin.set_fact:
        _rustfs_state_ilm_current: >-
          {{ (((_rustfs_state_ilm.stdout | from_json).rules | default([]))
              | david_igou.rustfs_configuration.rustfs_canonical_ilm)
             if _rustfs_state_ilm.rc == 0 else [] }}
        _rustfs_state_ilm_desired: "{{ rustfs_state_bucket.lifecycle.rules | david_igou.rustfs_configuration.rustfs_canonical_ilm }}"

    - name: "Converge lifecycle for bucket {{ rustfs_state_bucket.name }}"
      when: _rustfs_state_ilm_current != _rustfs_state_ilm_desired
      block:
        - name: "Record lifecycle change for bucket {{ rustfs_state_bucket.name }}"
          ansible.builtin.set_fact:
            rustfs_state_changes: "{{ rustfs_state_changes + [inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':lifecycle:import'] }}"
            rustfs_state_diffs: >-
              {{ rustfs_state_diffs
                 + [{'entry': inventory_hostname ~ ':bucket:' ~ rustfs_state_bucket.name ~ ':lifecycle',
                     'current': _rustfs_state_ilm_current,
                     'desired': _rustfs_state_ilm_desired}] }}

        - name: "Render lifecycle rules for bucket {{ rustfs_state_bucket.name }}"
          ansible.builtin.copy:
            content: "{{ {'rules': rustfs_state_bucket.lifecycle.rules} | to_nice_json }}"
            dest: "{{ _rustfs_state_workdir }}/ilm-{{ rustfs_state_bucket.name }}.json"
            mode: "0600"
          changed_when: false

        - name: "Import lifecycle rules to bucket {{ rustfs_state_bucket.name }}"
          ansible.builtin.command: >-
            {{ _rustfs_state_rc }} ilm rule import
            {{ rustfs_state_alias }}/{{ rustfs_state_bucket.name }}
            {{ _rustfs_state_workdir }}/ilm-{{ rustfs_state_bucket.name }}.json
          environment: "{{ _rustfs_state_env }}"
          register: _rustfs_state_ilm_import
          retries: "{{ rustfs_state_retries }}"
          delay: "{{ rustfs_state_retry_delay }}"
          until: _rustfs_state_ilm_import.rc != 3
          changed_when: true

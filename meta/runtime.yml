---
requires_ansible: ">=2.16.0"

# module_defaults group: set endpoint/access_key/secret_key once for every
# module in this collection via `module_defaults: {group/david_igou.rustfs.rustfs: {...}}`.
action_groups:
  rustfs:
    - bucket
    - bucket_info
    - bucket_lifecycle
    - bucket_quota
    - credential_info
    - group
    - group_info
    - policy
    - policy_attachment
    - policy_info
    - service_account
    - service_account_info
    - user
    - user_info
